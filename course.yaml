# Course Configuration for Chibi Bot
# Applied Soft Computing: Modeling Complex Systems with Deep Learning

course:
  name: "Applied Soft Computing: Modeling Complex Systems with Deep Learning"
  code: "APPLSOFTCOMP"
  description: "Master modern machine learning techniques for text, images, and graphs through hands-on applications"

# Module definitions
modules:
  - id: "m00"
    name: "Practice Module: Binghamton University"
    description: "A practice module to learn how /quiz and /llm-quiz commands work using facts about Binghamton University"
    content_urls:
      - "file:///test_content/binghamton-university.md"
    concepts:
      - id: "bu-history-founding"
        name: "History and Founding"
        type: "theory"
        difficulty: 1
        description: "Binghamton University's evolution from Triple Cities College to premier public research university"
        quiz_focus: "Founded 1946 as Triple Cities College in Endicott for WWII veterans, originally branch of Syracuse University, joined SUNY as Harpur College in 1950 (named for Robert Harpur colonial teacher), moved to Vestal in 1961 on 387 acres, became Binghamton University in 1965 as SUNY university center (one of four flagship institutions), campus now 930+ acres"
        prerequisites: []

      - id: "bu-campus-facilities"
        name: "Campus and Facilities"
        type: "theory"
        difficulty: 1
        description: "The physical campus including buildings, residential communities, and facilities"
        quiz_focus: "930-acre campus in Vestal, Academic Spine as main corridor, Bartle Library with iconic tower, five original residential colleges (Newing-arts, Hinman-wellness, College-in-the-Woods/CIW-sustainability, Mountainview-global, Dickinson-leadership) plus Susquehanna apartments, 190-acre Nature Preserve with trails, Events Center seats 5000+ for basketball and events, ITC (Innovative Technologies Complex) opened 2011 for engineering"
        prerequisites: []

      - id: "bu-academic-structure"
        name: "Academic Structure and Programs"
        type: "theory"
        difficulty: 1
        description: "The colleges, schools, and academic organization of Binghamton University"
        quiz_focus: "Harpur College largest (Arts & Sciences, 10,300+ undergrads, 26 departments), Watson College of Engineering founded 1983 (named for Thomas J. Watson Sr. IBM founder, includes Computer Science), School of Management (AACSB accredited - top 5% worldwide), Decker College of Nursing, CCPA (College of Community and Public Affairs), R1 research classification (very high research activity), 130+ graduate programs including masters and doctoral"
        prerequisites: []

      - id: "bu-student-life"
        name: "Student Life and Campus Culture"
        type: "theory"
        difficulty: 1
        description: "Student demographics, organizations, athletics, and campus culture"
        quiz_focus: "18,000+ total students (14,300 undergrads, 3,700 grad), diverse (35-40% Asian American, students from 100+ countries), 400+ student organizations, NCAA Division I athletics as Bearcats in America East Conference, residential college system creates smaller communities, ranked top 40 public universities, 'Public Ivy' recognition, academically serious and career-focused student culture, Spring Fling and Late Nite Binghamton major events"
        prerequisites: []

  - id: "m01"
    name: "The Data Scientist's Toolkit"
    description: "Tools and principles of reproducible data science"
    content_urls:
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m01-toolkit/overview.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m01-toolkit/git-github.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m01-toolkit/data-provenance.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m01-toolkit/tidy-data.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m01-toolkit/reproduceability.qmd"
    concepts:
      - id: "version-control"
        name: "Version Control with Git & GitHub"
        type: "practical"
        difficulty: 2
        description: "Version control tracks changes in code and data, enabling collaboration and recovery from mistakes"
        quiz_focus: "Git commands (commit, push, pull, branch, merge), GitHub workflows, resolving merge conflicts, collaborative development practices"
        prerequisites: []

      - id: "data-provenance"
        name: "Data Provenance"
        type: "theory"
        difficulty: 2
        description: "Data provenance is the complete history of data from collection through transformations"
        quiz_focus: "Why provenance matters for reproducibility, documenting data sources, tracking transformations, metadata best practices"
        prerequisites: []

      - id: "tidy-data"
        name: "Tidy Data Principles"
        type: "theory"
        difficulty: 2
        description: "Tidy data principles structure datasets where each variable is a column, each observation is a row, and each value is a cell"
        quiz_focus: "Identifying tidy vs messy data, reshaping operations (pivot, melt), benefits for analysis workflows"
        prerequisites: []

      - id: "reproducibility"
        name: "Reproducible Environments"
        type: "practical"
        difficulty: 3
        description: "Creating reproducible computational environments ensures code runs consistently across different machines and time"
        quiz_focus: "Virtual environments, conda/pip dependency management, requirements.txt, Docker basics, environment.yml files"
        prerequisites: []

  - id: "m02"
    name: "Visualizing Complexity"
    description: "Principles and techniques for visualizing data from simple distributions to networks"
    content_urls:
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m02-visualization/overview.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m02-visualization/principles.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m02-visualization/1d-data.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m02-visualization/2d-data.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m02-visualization/highd-data.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m02-visualization/networks.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m02-visualization/time-series.qmd"
    concepts:
      - id: "viz-principles"
        name: "Principles of Effective Visualization"
        type: "theory"
        difficulty: 2
        description: "Core principles for creating clear, honest, and insightful data visualizations"
        quiz_focus: "Data-ink ratio, chart junk, choosing appropriate chart types, color theory, accessibility"
        prerequisites: []

      - id: "dimensionality-reduction"
        name: "Dimensionality Reduction"
        type: "theory"
        difficulty: 3
        description: "Techniques like PCA, t-SNE, and UMAP for visualizing high-dimensional data in 2D/3D space"
        quiz_focus: "When to use PCA vs t-SNE vs UMAP, interpreting reduced dimensions, perplexity parameter, preserving local vs global structure"
        prerequisites: ["viz-principles"]

      - id: "network-visualization"
        name: "Network Visualization"
        type: "practical"
        difficulty: 3
        description: "Visualizing graph structures using layout algorithms and node-link diagrams"
        quiz_focus: "Force-directed layouts, adjacency matrices, node positioning algorithms, handling large networks"
        prerequisites: ["viz-principles"]

      - id: "time-series-viz"
        name: "Time-Series Visualization"
        type: "practical"
        difficulty: 2
        description: "Visualizing temporal patterns, trends, and seasonality in time-dependent data"
        quiz_focus: "Line charts, log scales, small multiples, handling missing data, trend extraction"
        prerequisites: ["viz-principles"]

  - id: "m03"
    name: "Agentic Coding"
    description: "Leveraging AI agents for software development through prompt engineering and context management"
    content_urls:
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m03-agentic-coding/overview.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m03-agentic-coding/hands-on.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m03-agentic-coding/prompt-tuning.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m03-agentic-coding/agentic-ai.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m03-agentic-coding/context-engineering.qmd"
    concepts:
      - id: "prompt-engineering"
        name: "Prompt Engineering"
        type: "practical"
        difficulty: 2
        description: "Crafting effective prompts to guide LLM behavior for coding tasks"
        quiz_focus: "Few-shot learning, chain-of-thought prompting, specifying output format, iteration strategies"
        prerequisites: []

      - id: "agentic-systems"
        name: "Agentic AI Systems"
        type: "theory"
        difficulty: 3
        description: "Understanding how AI agents use tools, memory, and planning to accomplish complex tasks autonomously"
        quiz_focus: "ReAct pattern, tool use, agent loops, planning vs execution, limitations and failure modes"
        prerequisites: ["prompt-engineering"]

      - id: "context-management"
        name: "Context Engineering"
        type: "practical"
        difficulty: 3
        description: "Managing context windows effectively through chunking, retrieval, and context compression"
        quiz_focus: "Token limits, RAG systems, semantic search, context relevance, memory management"
        prerequisites: ["prompt-engineering"]

  - id: "m04"
    name: "Deep Learning for Text"
    description: "Understanding LLMs, transformers, and embedding representations for natural language"
    content_urls:
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m04-text/overview.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m04-text/llm-intro.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m04-text/gpt-inference.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m04-text/tokenization.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m04-text/transformers.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m04-text/bert-gpt.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m04-text/sentence-transformers.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m04-text/word-embeddings.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m04-text/semaxis.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m04-text/word-bias.qmd"
    concepts:
      - id: "llm-basics"
        name: "Large Language Models"
        type: "theory"
        difficulty: 2
        description: "Understanding what LLMs are, how they generate text, and practical usage patterns"
        quiz_focus: "What LLMs learn, pretraining vs fine-tuning, model scale, capabilities and limitations"
        prerequisites: []

      - id: "gpt-sampling"
        name: "GPT Inference and Sampling"
        type: "practical"
        difficulty: 3
        description: "Controlling text generation through temperature, top-k, top-p, and other sampling parameters"
        quiz_focus: "Temperature effects, top-k vs top-p sampling, beam search, deterministic vs stochastic generation"
        prerequisites: ["llm-basics"]

      - id: "tokenization"
        name: "Tokenization"
        type: "theory"
        difficulty: 2
        description: "How LLMs convert text into tokens using BPE, WordPiece, and other algorithms"
        quiz_focus: "Subword tokenization, vocabulary size, token efficiency across languages, edge cases"
        prerequisites: ["llm-basics"]

      - id: "transformers"
        name: "Transformer Architecture"
        type: "theory"
        difficulty: 4
        description: "The architecture that revolutionized NLP through self-attention mechanisms"
        quiz_focus: "Self-attention mechanism, positional encoding, multi-head attention, feed-forward layers, layer normalization"
        prerequisites: ["tokenization"]

      - id: "bert-gpt"
        name: "BERT vs GPT Architectures"
        type: "theory"
        difficulty: 3
        description: "Understanding encoder-only (BERT), decoder-only (GPT), and their use cases"
        quiz_focus: "Bidirectional vs unidirectional attention, masked language modeling, autoregressive generation, when to use each"
        prerequisites: ["transformers"]

      - id: "sentence-transformers"
        name: "Sentence Transformers"
        type: "practical"
        difficulty: 3
        description: "Models that produce fixed-length embeddings for semantic similarity"
        quiz_focus: "Siamese networks, contrastive learning, cosine similarity, semantic search applications"
        prerequisites: ["transformers"]

      - id: "word-embeddings"
        name: "Word Embeddings"
        type: "theory"
        difficulty: 3
        description: "Representing words as vectors where geometric relationships capture semantic meaning"
        quiz_focus: "Word2Vec (CBOW, Skip-gram), distributional hypothesis, analogies in vector space, limitations"
        prerequisites: []

      - id: "semantic-axes"
        name: "Semantic Axes"
        type: "theory"
        difficulty: 3
        description: "Measuring meaning as direction in embedding space along interpretable dimensions"
        quiz_focus: "Constructing semantic axes, projecting words onto axes, measuring bias, interpreting dimensions"
        prerequisites: ["word-embeddings"]

      - id: "word-bias"
        name: "Bias in Word Embeddings"
        type: "theory"
        difficulty: 3
        description: "How embeddings reflect and amplify societal biases present in training data"
        quiz_focus: "Measuring bias through associations, gender bias, debiasing techniques, ethical implications"
        prerequisites: ["word-embeddings", "semantic-axes"]

  - id: "m05"
    name: "Deep Learning for Images"
    description: "CNNs and vision architectures from pixels to state-of-the-art models"
    content_urls:
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m05-images/overview.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m05-images/01-what-is-an-image.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m05-images/02-the-deep-learning-revolution.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m05-images/03-using-cnn-models.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m05-images/04-cnn-innovations.qmd"
    concepts:
      - id: "image-representation"
        name: "Images as Data Structures"
        type: "theory"
        difficulty: 2
        description: "Understanding how images are represented as multidimensional arrays and why spatial structure matters"
        quiz_focus: "RGB channels, pixel values, tensors, coordinate systems, spatial relationships"
        prerequisites: []

      - id: "deep-learning-revolution"
        name: "The Deep Learning Revolution"
        type: "theory"
        difficulty: 2
        description: "The historical shift from hand-crafted features to learned representations"
        quiz_focus: "LeNet vs AlexNet, ImageNet competition, why deep learning won, feature learning vs feature engineering"
        prerequisites: ["image-representation"]

      - id: "cnn-building-blocks"
        name: "CNN Building Blocks"
        type: "practical"
        difficulty: 3
        description: "Core operations in CNNs: convolution, pooling, activation functions, and batch normalization"
        quiz_focus: "Convolution operation, kernel size, stride, padding, max/avg pooling, ReLU activation, batch normalization"
        prerequisites: ["image-representation"]

      - id: "transfer-learning"
        name: "Transfer Learning"
        type: "practical"
        difficulty: 3
        description: "Using pre-trained models and fine-tuning for new tasks with limited data"
        quiz_focus: "Feature extraction vs fine-tuning, freezing layers, when transfer learning helps, choosing pre-trained models"
        prerequisites: ["cnn-building-blocks"]

      - id: "cnn-architectures"
        name: "CNN Architecture Evolution"
        type: "theory"
        difficulty: 4
        description: "Understanding VGG, Inception, ResNet, and Vision Transformers as solutions to specific problems"
        quiz_focus: "VGG simplicity, Inception's multi-scale approach, ResNet skip connections, attention in Vision Transformers"
        prerequisites: ["cnn-building-blocks"]

  - id: "m06"
    name: "Deep Learning for Graphs"
    description: "Extending convolution and embeddings to irregular graph structures"
    content_urls:
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m06-graph/overview.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m06-graph/01-from-images-to-graphs.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m06-graph/02-spectral-perspective.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m06-graph/03-spatial-networks.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m06-graph/04-graph-embeddings.qmd"
    concepts:
      - id: "graph-convolution-intro"
        name: "From Images to Graphs"
        type: "theory"
        difficulty: 3
        description: "Understanding how convolution principles extend from regular grids to irregular graph structures"
        quiz_focus: "Locality, parameter sharing, hierarchical features on graphs, challenges of irregular structure"
        prerequisites: []

      - id: "spectral-graph-theory"
        name: "Spectral Perspective"
        type: "theory"
        difficulty: 4
        description: "Using graph Laplacian eigenvectors as frequency basis for defining graph convolution"
        quiz_focus: "Graph Laplacian, eigendecomposition, spectral filters, frequency interpretation, computational cost"
        prerequisites: ["graph-convolution-intro"]

      - id: "spatial-graph-networks"
        name: "Spatial Graph Networks"
        type: "practical"
        difficulty: 4
        description: "Defining convolution as neighborhood aggregation through GCN, GraphSAGE, GAT, and GIN"
        quiz_focus: "Message passing, GCN layer, attention mechanisms in GAT, sampling in GraphSAGE, expressive power"
        prerequisites: ["graph-convolution-intro"]

      - id: "graph-embeddings"
        name: "Graph Embeddings"
        type: "practical"
        difficulty: 3
        description: "Learning node representations through spectral methods and random walk approaches like DeepWalk"
        quiz_focus: "Spectral embeddings, random walks on graphs, DeepWalk algorithm, node2vec, applications to clustering"
        prerequisites: ["graph-convolution-intro"]

  - id: "m07"
    name: "Representations & Structuralism"
    description: "Philosophical foundations of representation learning and the structuralist perspective"
    content_urls:
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m07-representation/overview.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m07-representation/01-boundaries.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m07-representation/02-structuralism.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m07-representation/03-embeddings.qmd"
      - "https://raw.githubusercontent.com/skojaku/applied-soft-comp/master/docs/lecture-note/m07-representation/04-universal.qmd"
    concepts:
      - id: "categorical-boundaries"
        name: "When Boundaries Blur"
        type: "theory"
        difficulty: 2
        description: "Understanding how observation and language create artificial boundaries in continuous reality"
        quiz_focus: "Continuum of categories, observer-dependent divisions, examples from age/geography/color"
        prerequisites: []

      - id: "structuralism"
        name: "Meaning as Difference"
        type: "theory"
        difficulty: 3
        description: "The structuralist insight that meaning arises from relationships rather than fixed definitions"
        quiz_focus: "Saussurean linguistics, relational meaning, Buddhist logic, structural anthropology"
        prerequisites: ["categorical-boundaries"]

      - id: "embeddings-philosophy"
        name: "From Categories to Coordinates"
        type: "theory"
        difficulty: 3
        description: "How embeddings operationalize structuralism by mapping concepts to continuous vector spaces"
        quiz_focus: "Word2Vec as geometry, restoring gradation, vector arithmetic, continuous vs discrete representations"
        prerequisites: ["structuralism", "word-embeddings"]

      - id: "universal-representations"
        name: "Universal Representations"
        type: "theory"
        difficulty: 3
        description: "How the embedding paradigm unifies text, images, networks, and time-series through relational structure"
        quiz_focus: "Cross-modal embeddings, unified latent spaces, CLIP, applications across data types"
        prerequisites: ["embeddings-philosophy"]

# Available quiz formats
quiz_formats:
  - id: "multiple-choice"
    name: "Multiple Choice"
    description: "Choose the correct answer from 4 options (A, B, C, D)"

  - id: "free-form"
    name: "Free Form"
    description: "Explain concepts in your own words"

  - id: "short-answer"
    name: "Short Answer"
    description: "Brief text response (1-3 sentences)"

  - id: "true-false"
    name: "True/False"
    description: "Determine if a statement is true or false"

  - id: "fill-blank"
    name: "Fill in the Blank"
    description: "Complete the sentence with the missing term"
